name: Build

on:
  push:
    tags:
      - 'v*' # 當推送標籤如 v1.0.0 時觸發自動打包與發佈
  workflow_dispatch: # 允許手動在 GitHub 網頁上觸發

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write # 必須賦予寫入權限才能建立 Release 草稿

    steps:
      # Step 1: 複製專案原始碼
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # 很重要！必須設為 0 才能抓到完整的 Git 歷史紀錄來產生 Changelog

      # Step 2: 只提取純 Commit 標題，格式化為 "- 訊息"
      - name: Generate Pure Changelog
        run: |
          $currentTag = "${{ github.ref_name }}"
          
          # 嘗試取得上一個 Tag，如果失敗（例如第一個 tag）則設為空字串
          $previousTag = ""
          try {
              $previousTag = git describe --tags --abbrev=0 "${currentTag}^" 2>$null
          } catch {
              $previousTag = ""
          }
          
          # 根據是否有舊 Tag 來決定 Git Log 範圍
          if ([string]::IsNullOrEmpty($previousTag)) {
              $rawLogs = git log --format="%B" $currentTag
          } else {
              $rawLogs = git log --format="%B" "${previousTag}..${currentTag}"
          }
          
          # 處理多行文字 (PowerShell 邏輯)
          # 1. 過濾掉空白行
          # 2. 清除前後空白
          # 3. 如果不是以 '-' 或 '*' 開頭，就補上 '- '
          $commitLines = $rawLogs -split "`r?`n" | Where-Object { $_ -match '\S' } | ForEach-Object {
              $line = $_.Trim()
              if ($line -match '^[-\*]') {
                  $line
              } else {
                  "- $line"
              }
          }
          
          if ($commitLines.Count -eq 0) {
              $commitLogs = "- 無新更新項目"
          } else {
              $commitLogs = $commitLines -join "`n"
          }
          
          # 寫入 GitHub 環境變數 (PowerShell 的多行寫法)
          "RELEASE_NOTES<<EOF" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $commitLogs | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "EOF" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # Step 3: 設定 Node.js 環境
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22 # 建議改成你專案使用的 Node.js 版本
          cache: 'pnpm'     # 如果用 yarn 或 pnpm，請改成對應名稱

      # Step 4: 安裝專案依賴套件
      - name: Install dependencies
        run: pnpm i

      # Step 5: 執行打包並自動發佈到 GitHub Release
      - name: Build and Publish Electron App
        env:
          # GitHub 會自動提供這個 Token，讓 electron-builder 有權限上傳檔案到 Release
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_MARKET_API_URL: ${{ secrets.VITE_MARKET_API_URL }}
        run: |
          pnpm run build -p always

      # Step 6: 更新 Release Notes
      - name: Update Existing Draft Release Notes
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ github.ref_name }}
          append_body: false # 設為 false 會直接覆蓋 Electron builder 預設的空白內文
          body: |
            ## 🛠 更新日誌 (Commits)
            ${{ steps.changelog.outputs.RELEASE_NOTES }} 
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}