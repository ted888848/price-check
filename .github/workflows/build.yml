name: Build

permissions:
  contents: write

on:
  push:
    tags:
      - "v*" # 當推送標籤如 v1.0.0 時觸發自動打包與發佈
  workflow_dispatch: # 允許手動在 GitHub 網頁上觸發

jobs:
  release:
    runs-on: windows-latest
    outputs:
      release_url: ${{ steps.get_release_url.outputs.url }}

    steps:
      # Step 1: 複製專案原始碼（需要完整 history 才能讀取 tag 之間的 commit）
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # 抓取完整 git history，才能比對 tag 之間的 commit

      # Step 2: 設定環境
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22 # 建議改成你專案使用的 Node.js 版本
          cache: "pnpm" # 如果用 yarn 或 pnpm，請改成對應名稱

      # Step 3: 安裝專案依賴套件
      - name: Install dependencies
        run: pnpm i

      # Create the draft release with notes before uploading build artifacts.
      - name: Create draft release with release notes
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          CURRENT_TAG="${GITHUB_REF_NAME}"
          PREV_TAG=$(git tag --sort=-version:refname | grep -E '^v' | sed -n '2p')

          if [ -z "$PREV_TAG" ]; then
            RAW=$(git log "$CURRENT_TAG" --pretty=format:"%B" --invert-grep --grep='^chore:' --)
          else
            RAW=$(git log "$PREV_TAG".."$CURRENT_TAG" --pretty=format:"%B" --invert-grep --grep='^chore:' --)
          fi

          NOTES=$(echo "$RAW" | awk 'NF > 0 { print "- " $0 }')
          echo "Release notes:"
          echo "$NOTES"

          if gh release view "$CURRENT_TAG" >/dev/null 2>&1; then
            gh release edit "$CURRENT_TAG" --notes "$NOTES"
          else
            gh release create "$CURRENT_TAG" \
              --draft \
              --title "$CURRENT_TAG" \
              --notes "$NOTES"
          fi

      - name: Build and Publish Electron App
        env:
          # GitHub 會自動提供這個 Token，讓 electron-builder 有權限上傳檔案到 Release
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_MARKET_API_URL: ${{ secrets.VITE_MARKET_API_URL }}
        run: |
          pnpm run build -p onTagOrDraft

      - name: Get release URL
        id: get_release_url
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          URL=$(gh release view "${GITHUB_REF_NAME}" --json url -q .url)
          EDIT_URL=$(echo "$URL" | sed 's#/tag/#/edit/#')
          echo "view url: $URL"
          echo "edit url: $EDIT_URL"
          echo "url=$EDIT_URL" >> "$GITHUB_OUTPUT"

  # 打包與發佈成功時，發送 Discord 通知
  notify-success:
    needs: release
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord success notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RELEASE_URL: ${{ needs.release.outputs.release_url }}
        shell: bash
        run: |
          curl -H "Content-Type: application/json" \
            -d '{
              "embeds": [{
                "title": "✅ ${{ github.repository }} 打包發佈成功",
                "description": "Tag: `${{ github.ref_name }}`\n觸發者: ${{ github.actor }}",
                "color": 3066993,
                "fields": [
                  {
                    "name": "Release 連結",
                    "value": "'"$RELEASE_URL"'"
                  },
                  {
                    "name": "Workflow 紀錄",
                    "value": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  }
                ]
              }]
            }' \
            "$DISCORD_WEBHOOK"

  # 打包或發佈失敗時，發送 Discord 通知
  notify-failure:
    needs: release
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord failure notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        shell: bash
        run: |
          curl -H "Content-Type: application/json" \
            -d '{
              "embeds": [{
                "title": "❌ ${{ github.repository }} 打包發佈失敗",
                "description": "Tag: `${{ github.ref_name }}`\n觸發者: ${{ github.actor }}",
                "color": 15158332,
                "fields": [
                  {
                    "name": "Workflow 紀錄",
                    "value": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  }
                ]
              }]
            }' \
            "$DISCORD_WEBHOOK"
