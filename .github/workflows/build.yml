name: Build

on:
  push:
    tags:
      - 'v*' # 當推送標籤如 v1.0.0 時觸發自動打包與發佈
  workflow_dispatch: # 允許手動在 GitHub 網頁上觸發

jobs:
  release:
    runs-on: windows-latest

    steps:
      # Step 1: 複製專案原始碼（需要完整 history 才能讀取 tag 之間的 commit）
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # 抓取完整 git history，才能比對 tag 之間的 commit

      # Step 2: 設定環境
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22 # 建議改成你專案使用的 Node.js 版本
          cache: 'pnpm'     # 如果用 yarn 或 pnpm，請改成對應名稱

      # Step 3: 安裝專案依賴套件
      - name: Install dependencies
        run: pnpm i

      # Step 4: 執行打包並自動發佈到 GitHub Release
      - name: Build and Publish Electron App
        env:
          # GitHub 會自動提供這個 Token，讓 electron-builder 有權限上傳檔案到 Release
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_MARKET_API_URL: ${{ secrets.VITE_MARKET_API_URL }}
        run: |
          pnpm run build -p always

      # Step 5: 從前兩個 tag 之間的 commit body 產生 release notes，並更新 draft release
      - name: Generate release notes and update draft
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          CURRENT_TAG="${GITHUB_REF_NAME}"

          # 取得排序後倒數第二個 tag（即上一個 release tag）
          PREV_TAG=$(git tag --sort=-version:refname | grep -E '^v' | sed -n '2p')

          echo "目前 tag：$CURRENT_TAG"
          echo "前一個 tag：$PREV_TAG"

          if [ -z "$PREV_TAG" ]; then
            # 若沒有前一個 tag，就取所有 commit
            RAW=$(git log "$CURRENT_TAG" --pretty=format:"%B" -- )
          else
            RAW=$(git log "$PREV_TAG".."$CURRENT_TAG" --pretty=format:"%B" --)
          fi

          # 將每一行非空白文字轉成 "- 內容" 格式，並過濾掉只有空白的行
          NOTES=$(echo "$RAW" | awk 'NF > 0 { print "- " $0 }')

          echo "生成的 release notes："
          echo "$NOTES"

          # 使用 gh CLI 更新對應 tag 的 draft release notes（覆蓋）
          gh release edit "$CURRENT_TAG" --notes "$NOTES"

# 打包與發佈成功時，發送 Discord 通知
  notify-success:
    needs: release
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord success notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        shell: bash
        run: |
          curl -H "Content-Type: application/json" \
            -d '{
              "embeds": [{
                "title": "✅ ${{ github.repository }} 打包發佈成功",
                "description": "Tag: `${{ github.ref_name }}`\n觸發者: ${{ github.actor }}",
                "color": 3066993,
                "fields": [
                  {
                    "name": "Release 連結",
                    "value": "${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
                  },
                  {
                    "name": "Workflow 紀錄",
                    "value": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  }
                ]
              }]
            }' \
            "$DISCORD_WEBHOOK"

  # 打包或發佈失敗時，發送 Discord 通知
  notify-failure:
    needs: release
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord failure notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        shell: bash
        run: |
          curl -H "Content-Type: application/json" \
            -d '{
              "embeds": [{
                "title": "❌ ${{ github.repository }} 打包發佈失敗",
                "description": "Tag: `${{ github.ref_name }}`\n觸發者: ${{ github.actor }}",
                "color": 15158332,
                "fields": [
                  {
                    "name": "Workflow 紀錄",
                    "value": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  }
                ]
              }]
            }' \
            "$DISCORD_WEBHOOK"